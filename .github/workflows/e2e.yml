name: E2E

# Login wall phase 2: the logged-out and signed-in browser runs against a production
# build with the Clerk development keys. The test user (e2e+clerk_test@canhav.com) is
# created by e2e/clerk.setup.ts through the Backend API if it is missing.
on:
  push:
    branches: [main]
    # Only changes that can alter what a visitor sees or downloads: app code, tests, static files, dependencies,
    # Next and TypeScript config, and the build step that decides what is public. Data, docs and other scripts skip
    # it (daily refresh commits never trigger it anyway). Run it by hand from the Actions tab when in doubt.
    paths:
      - "src/**"
      - "e2e/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "tsconfig.json"
      - "scripts/build-data.ts"
      - "scripts/check-public-bundle.mjs"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels the run still in progress, so a burst of pushes is tested once, on its last commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth:
    # No apt step: in the first two runs `playwright install --with-deps` stalled for minutes because the
    # runner could not resolve the Ubuntu mirrors ("Temporary failure resolving azure.archive.ubuntu.com").
    # The runner image already has every library Chromium needs (the first run's apt log listed them all as
    # installed; only optional fonts were new), so only the browser is downloaded, from Playwright's CDN.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build data
        run: npm run data
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      - name: Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Logged-out and logged-in runs
        run: npm run screenshots:auth
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-auth-results
          path: e2e/test-results-auth
          retention-days: 7
